services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: delta_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-delta}
      PGDATA: /var/lib/postgresql/data
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind directly to the data dir so it OVERRIDES the image's VOLUME
      # declaration (avoids an anonymous volume shadowing our D: mount).
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-delta}"]
      interval: 5s
      timeout: 5s
      retries: 12
